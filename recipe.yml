name: Webinar Kit
description: Provides an ability to add Webinars on a Drupal website. Adds a Webinar Content type and a view display upcoming and past Webinars.
install:
  # Core
  - datetime
  - file
  - link
  - media
  - media_library
  - views
  # Contrib
  - field_group
  - pathauto
config:
  actions:
    # To avoid conflict create field_date if it doesn't exist.
    field.storage.node.field_date:
      id: node.field_date
      field_name: field_date
      entity_type: node
      type: datetime
      settings:
        datetime_type: datetime
      module: datetime
      locked: false
      cardinality: 1
      translatable: true
      indexes: {}
      persist_with_no_fields: false
      custom_storage: false
